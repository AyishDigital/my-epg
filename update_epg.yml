name: Auto Generate EPG

on:
  schedule:
    - cron: '0 0 * * *' # Dijalankan setiap hari pada pukul 12:00 tengah malam UTC
  workflow_dispatch: # Membolehkan anda tekan butang 'Run' secara manual di GitHub bila-bila masa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python script
        run: python generate_epg.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update epg.xml harian"
          file_pattern: epg.xml